server {
    listen 80;
    server_name _;

    # ---- 压缩（2026-11-12）----
    # 原来没有 gzip：1.16MB 的 bootstrap chunk 原样下发。
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/javascript application/x-javascript application/json
        application/xml+rss image/svg+xml application/font-woff font/woff2;

    # 构建产物里每个 js / css / html 都有同名 .gz（构建时 gzip -9）⇒ 直接发预压缩件。
    # ⚠️ `gzip on` 不要删：万一 .gz 没进镜像，动态压缩还能顶上。
    # 若 nginx -t 报 unknown directive "gzip_static"（被精简过的镜像），删掉这一行即可。
    gzip_static on;

    # ---- 带 hash 的静态资源：永久缓存 ----
    # 发版后只有 index.html 需要重新取，assets 全部命中本地缓存。
    location ^~ /assets/ {
        root /usr/share/nginx/html;
        # 不写 expires：它会再生成一条 Cache-Control，和下面 add_header 叠成两个同名头。
        expires off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # ---- 其余（index.html / SPA 回退 / favicon）：每次都校验 ----
    location / {
        root /usr/share/nginx/html;
        index index.html;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
